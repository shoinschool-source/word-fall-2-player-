<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語ドロップ対戦 (Vocab Word Drop) - Admin & P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        h1 { margin: 0 0 10px 0; font-size: 24px; color: #00ffff; text-shadow: 0 0 8px rgba(0,255,255,0.5); }

        /* ロビー / 対戦接続パネル */
        #p2p-panel {
            background: #181a24;
            border: 1px solid #2a2d3d;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            max-width: 680px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .input-group { display: flex; gap: 5px; align-items: center; font-size: 13px; }

        input, select {
            background: #0d0e15;
            border: 1px solid #3d415a;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        button {
            padding: 6px 12px;
            background-color: #00ffff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        button:hover { background-color: #00cccc; box-shadow: 0 0 8px rgba(0,255,255,0.4); }
        button.admin-btn { background-color: #f39c12; color: #000; }
        button.admin-btn:hover { background-color: #e67e22; }

        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background: #333;
            color: #aaa;
        }
        .status-badge.connected { background: #1b4332; color: #2ecc71; border: 1px solid #2ecc71; }

        /* モーダル / 管理者設定画面 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #181a24;
            border: 2px solid #f39c12;
            border-radius: 8px;
            padding: 20px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.3);
        }

        .modal-card h2 { margin: 0; font-size: 18px; color: #f39c12; border-bottom: 1px solid #3d415a; padding-bottom: 8px; }
        .setting-section-title { font-size: 12px; color: #00ffff; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }

        /* ゲームレイアウト */
        #game-layout {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .player-board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        /* ターゲット単語表示カード */
        #target-card {
            background: #181a24;
            border: 2px solid #00ffff;
            border-radius: 8px;
            padding: 8px 12px;
            text-align: center;
            width: 300px;
            min-height: 65px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #target-label { font-size: 11px; color: #00ffff; font-weight: bold; letter-spacing: 1px; }
        #target-word { font-size: 18px; font-weight: bold; color: #fff; margin-top: 4px; }

        /* スコア・タイマーバー */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            width: 300px;
            font-size: 12px;
            color: #aaa;
            background: #181a24;
            padding: 6px 10px;
            border-radius: 4px;
        }

        /* メインゲーム盤面 */
        .tetris-matrix {
            position: relative;
            width: 300px;
            height: 450px;
            background-color: #12131c;
            border: 2px solid #2a2d3d;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.1s;
        }

        /* カウントダウン / ラウンド開始前説明オーバーレイ */
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 14, 21, 0.93);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
        }

        #instruction-title { color: #00ffff; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        #instruction-text { color: #ffffff; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        #countdown-number { color: #f39c12; font-size: 42px; font-weight: bold; text-shadow: 0 0 10px rgba(243,156,18,0.6); }

        /* ペナルティ発生時の振動エフェクト */
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #e74c3c !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* 相手のミニ盤面 */
        .tetris-matrix.opponent {
            width: 180px;
            height: 270px;
            opacity: 0.85;
            border-color: #ff0055;
        }

        /* ブロックのスタイル */
        .word-block {
            position: absolute;
            background-color: #3498db;
            color: white;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.3), 0 2px 4px rgba(0,0,0,0.5);
            padding: 2px;
            word-break: break-word;
            line-height: 1.1;
        }

        .word-block.garbage {
            background-color: #555566 !important;
            color: #888899 !important;
            border: 1px solid #777788;
            cursor: not-allowed;
        }

        .type-object { background-color: #2ecc71; }
        .type-verb { background-color: #e74c3c; }
        .type-preposition { background-color: #f39c12; }

        /* ペナルティオーバーレイ表示 */
        #penalty-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            display: none;
            pointer-events: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
        }

        /* 操作ボタン */
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .level-btn { background: #1a1c29; color: #8a8d9b; border: 1px solid #2d3045; }
        .level-btn.active { background: #00ffff; color: #000; border-color: #00ffff; }
    </style>
</head>
<body>

<h1>単語ドロップ対戦 ⚔️ P2Pバトル</h1>

<!-- ロビー & 対戦接続パネル -->
<div id="p2p-panel">
    <div class="input-group">
        <span>あなたのID: </span>

</div>

<!-- 管理者設定モーダル画面 -->
<div id="admin-modal" class="modal-overlay">
    <div class="modal-card">

        <div class="setting-section-title">⏱️ レベル別 制限時間</div>

        <div class="setting-row">

                <option value="60" selected>60秒</option>

        </div>

        <div class="setting-row">
            <label for="time-lvl3">Level 3 (言い換え):</label>
            <select id="time-lvl3">
                <option value="45">45秒</option>
                <option value="60">60秒</option>
                <option value="90" selected>90秒</option>
                <option value="120">120秒</option>
                <option value="infinite">無制限 (∞)</option>
            </select>
        </div>

        <div class="setting-section-title">⚡ ゲームスピード & 攻撃設定</div>
        <div class="setting-row">
            <label for="speed-select">ブロックの落下速度:</label>
            <select id="speed-select">
                <option value="2500">ゆっくり (2.5秒)</option>
                <option value="1500" selected>ふつう (1.5秒)</option>
                <option value="1000">速い (1.0秒)</option>

        <div class="setting-row">

            <select id="garbage-select">

        <div class="setting-row">

        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
            <button onclick="toggleAdminModal(false)" style="background:#555; color:#fff;">キャンセル</button>
            <button onclick="saveAdminSettings()" style="background:#f39c12; color:#000;">適用して再スタート</button>
        </div>
    </div>
</div>

<!-- メインゲーム画面 -->
<div id="game-layout">
    <!-- 自分側の盤面 -->
    <div class="player-board-container">
        <div id="target-card">
            <span id="target-label">ターゲット (英語):</span>
            <div id="target-word">---</div>
        </div>

        <div class="stats-bar">
            <span id="score-display">スコア: 0 (🔥 x1.00)</span>
            <span id="timer-display">残り時間: 45秒</span>
        </div>

        <div id="tetris-matrix" class="tetris-matrix">
            <!-- ラウンド開始前カウントダウン ＆ 指示オーバーレイ -->
            <div id="countdown-overlay">
                <div id="instruction-title">LEVEL 1: 英 → 和</div>
                <div id="instruction-text">ターゲットの英語に合う<br><b>日本語ブロック</b>をタップ！</div>
                <div id="countdown-number">3</div>
            </div>

            <div id="penalty-overlay">⚠️ 盤面あふれ！<br>-300 pt</div>
        </div>

        <div class="controls">
            <button class="level-btn active" id="btn-lvl1" onclick="selectLevel(1)">L1: 英 → 和</button>
            <button class="level-btn" id="btn-lvl2" onclick="selectLevel(2)">L2: 和 → 英</button>
            <button class="level-btn" id="btn-lvl3" onclick="selectLevel(3)">L3: 言い換え(英語)</button>
            <button onclick="restartGame()" style="background:#e74c3c; color:#fff;">リセット</button>
        </div>
    </div>

    <!-- 相手側のミニ盤面 (対戦モード時) -->
    <div class="player-board-container" id="opponent-container" style="display: none;">
        <div style="font-size: 12px; color: #ff0055; font-weight: bold; margin-bottom: 4px;">対戦相手の盤面</div>
        <div class="stats-bar" style="width: 180px;">
            <span id="opp-score-display">スコア: 0</span>
            <span id="opp-blocks-display">ブロック: 0</span>
        </div>
        <div id="opponent-matrix" class="tetris-matrix opponent"></div>
    </div>
</div>

<script>
const COLS = 4;
const ROWS = 8;

// --- レベル別 個別タイマー設定対応 ---
let gameSettings = {
    levelTimers: {
        1: 45, // レベル1: 45秒
        2: 60, // レベル2: 60秒
        3: 90  // レベル3: 90秒
    },
    dropSpeed: 1500,     // 落下スピード(ミリ秒)
    garbageStreakReq: 3, // おじゃまを送る連続正解数
    overflowPenalty: 300 // 盤面があふれた際の減点数
};

// --- ゲーム状態変数 ---
let currentLevel = 1;
let currentTarget = null;
let activeBlocks = [];
let currentScore = 0;
let streakCount = 0;
let timeLeft = 45;
let gameTimer = null;
let dropInterval = null;
let countdownInterval = null;
let isGameOver = false;
let isCountingDown = false;

// --- PeerJS P2Pネットワーク ---
let peer = null;
let conn = null;
let isMultiplayer = false;

// --- 語彙データ ---
const VOCAB_POOL = [
    { english: "nevertheless", japanese: "それにもかかわらず", paraphrase: "IN SPITE OF THAT / STILL", type: "preposition" },
    { english: "South Sudan", japanese: "南スーダン", paraphrase: "A COUNTRY IN AFRICA", type: "object" },
    { english: "unite", japanese: "結びつける", paraphrase: "TO JOIN TOGETHER", type: "verb" },
    { english: "teammate", japanese: "チームメイト", paraphrase: "A FRIEND ON YOUR TEAM", type: "object" },
    { english: "focus", japanese: "集中する", paraphrase: "LOOK AT ONE THING", type: "verb" },
    { english: "cohesion", japanese: "団結", paraphrase: "WORKING WELL TOGETHER", type: "object" },
    { english: "highlight", japanese: "ハイライト", paraphrase: "BEST PART OF SOMETHING", type: "object" },
    { english: "tackle", japanese: "タックルする", paraphrase: "TRY TO STOP A PLAYER", type: "verb" },
    { english: "fierce", japanese: "激しい", paraphrase: "STRONG AND POWERFUL", type: "preposition" },
    { english: "embrace", japanese: "抱きしめる", paraphrase: "TO HUG SOMEONE", type: "verb" },
    { english: "legend", japanese: "伝説", paraphrase: "A VERY FAMOUS STORY", type: "object" },
    { english: "impression", japanese: "印象", paraphrase: "FEELING ABOUT SOMETHING", type: "object" },
    { english: "yearn", japanese: "切望する", paraphrase: "WANT SOMETHING VERY MUCH", type: "verb" },
    { english: "forgive", japanese: "許す", paraphrase: "SAY OK / NOT ANGRY", type: "verb" },
    { english: "comrade", japanese: "仲間", paraphrase: "A GOOD FRIEND", type: "object" },
    { english: "outlook", japanese: "前途", paraphrase: "FUTURE VIEW OR HOPE", type: "object" },
    { english: "splendid", japanese: "すばらしい", paraphrase: "GREAT / WONDERFUL", type: "preposition" },
    { english: "optimistic", japanese: "楽観的な", paraphrase: "FEELING HAPPY FOR FUTURE", type: "preposition" },
    { english: "revitalize", japanese: "復興させる", paraphrase: "MAKE NEW AND STRONG AGAIN", type: "verb" },
    { english: "agreement", japanese: "協定", paraphrase: "WHEN PEOPLE SAY YES", type: "object" },
    { english: "permanent", japanese: "永久の", paraphrase: "FOR A LONG TIME / FOREVER", type: "preposition" },
    { english: "violence", japanese: "暴力", paraphrase: "HURTING OTHERS", type: "object" },
    { english: "investment", japanese: "投資", paraphrase: "PUT MONEY TO GROW", type: "object" },
    { english: "potential", japanese: "可能性", paraphrase: "CHANCE TO BE GREAT", type: "object" },
    { english: "benefit", japanese: "恩恵", paraphrase: "A GOOD THING YOU GET", type: "object" },
    { english: "tremendous", japanese: "ものすごい", paraphrase: "VERY BIG OR GREAT", type: "preposition" }
];

// --- 管理者パネル設定 ---
function toggleAdminModal(show) {
    document.getElementById('admin-modal').style.display = show ? 'flex' : 'none';
}

function saveAdminSettings() {
    const parseTime = (id) => {
        const v = document.getElementById(id).value;
        return v === 'infinite' ? 'infinite' : parseInt(v, 10);
    };

    gameSettings.levelTimers[1] = parseTime('time-lvl1');
    gameSettings.levelTimers[2] = parseTime('time-lvl2');
    gameSettings.levelTimers[3] = parseTime('time-lvl3');

    gameSettings.dropSpeed = parseInt(document.getElementById('speed-select').value, 10);
    gameSettings.garbageStreakReq = parseInt(document.getElementById('garbage-select').value, 10);
    gameSettings.overflowPenalty = parseInt(document.getElementById('penalty-select').value, 10);

    toggleAdminModal(false);

    sendPeerData({ type: 'CONFIG', settings: gameSettings });
    restartGame();
}

// --- PeerJS 初期化 ---
function initPeer() {
    peer = new Peer();

    peer.on('open', (id) => {
        document.getElementById('my-peer-id').innerText = id;
    });

    peer.on('connection', (connection) => {
        conn = connection;
        setupConnection();
    });
}

function connectToPeer() {
    const oppId = document.getElementById('opponent-peer-id').value.trim();
    if (!oppId) return;
    conn = peer.connect(oppId);
    setupConnection();
}

function setupConnection() {
    conn.on('open', () => {
        isMultiplayer = true;
        document.getElementById('connection-status').innerText = "対戦中 ⚔️";
        document.getElementById('connection-status').classList.add('connected');
        document.getElementById('opponent-container').style.display = 'flex';
        
        sendPeerData({ type: 'CONFIG', settings: gameSettings });
        restartGame();
    });

    conn.on('data', (data) => {
        if (data.type === 'SYNC') {
            document.getElementById('opp-score-display').innerText = `スコア: ${data.score}`;
            document.getElementById('opp-blocks-display').innerText = `ブロック: ${data.blockCount}`;
            renderOpponentBoard(data.blocks);
        } else if (data.type === 'GARBAGE') {
            receiveGarbageBlocks(data.count);
        } else if (data.type === 'CONFIG') {
            gameSettings = data.settings;
            restartGame(false);
        } else if (data.type === 'RESTART') {
            restartGame(false);
        } else if (data.type === 'GAME_OVER') {
            evaluateWinner(data.finalScore);
        }
    });

    conn.on('close', () => {
        isMultiplayer = false;
        document.getElementById('connection-status').innerText = "一人プレイ中";
        document.getElementById('connection-status').classList.remove('connected');
        document.getElementById('opponent-container').style.display = 'none';
    });
}

function sendPeerData(data) {
    if (isMultiplayer && conn && conn.open) {
        conn.send(data);
    }
}

// --- ゲームエンジン ---
function selectLevel(lvl) {
    currentLevel = lvl;
    document.querySelectorAll('.level-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === lvl);
    });
    restartGame();
}

function restartGame(broadcast = true) {
    isGameOver = false;
    currentScore = 0;
    streakCount = 0;
    activeBlocks = [];
    
    if (broadcast) {
        sendPeerData({ type: 'RESTART' });
    }

    setNextTarget();
    startPreRoundSequence();
    renderGame();
}

// ラウンド開始前のインストラクション ＆ カウントダウン表示
function startPreRoundSequence() {
    isCountingDown = true;
    clearInterval(dropInterval);
    clearInterval(gameTimer);
    clearInterval(countdownInterval);

    const overlay = document.getElementById('countdown-overlay');
    const titleEl = document.getElementById('instruction-title');
    const textEl = document.getElementById('instruction-text');
    const countEl = document.getElementById('countdown-number');

    overlay.style.display = 'flex';

    if (currentLevel === 1) {
        titleEl.innerText = "LEVEL 1: 英 → 和";
        textEl.innerHTML = "ターゲットの英語に合う<br><b>日本語ブロック</b>をタップ！";
    } else if (currentLevel === 2) {
        titleEl.innerText = "LEVEL 2: 和 → 英";
        textEl.innerHTML = "ターゲットの日本語に合う<br><b>英単語ブロック</b>をタップ！";
    } else if (currentLevel === 3) {
        titleEl.innerText = "LEVEL 3: 言い換え (Paraphrase)";
        textEl.innerHTML = "簡単な英語の説明に合う<br><b>英単語ブロック</b>をタップ！";
    }

    let count = 3;
    countEl.innerText = count;

    countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
            countEl.innerText = count;
        } else {
            clearInterval(countdownInterval);
            overlay.style.display = 'none';
            isCountingDown = false;
            
            // カウントダウン終了後にタイマーとブロック落下を開始
            startTimer();
            dropInterval = setInterval(gameLoop, gameSettings.dropSpeed);
        }
    }, 1000);
}

function setNextTarget() {
    currentTarget = VOCAB_POOL[Math.floor(Math.random() * VOCAB_POOL.length)];
    
    const labelEl = document.getElementById('target-label');
    const wordEl = document.getElementById('target-word');

    if (currentLevel === 1) {
        labelEl.innerText = "ターゲット (英語):";
        wordEl.innerText = currentTarget.english;
    } else if (currentLevel === 2) {
        labelEl.innerText = "ターゲット (日本語):";
        wordEl.innerText = currentTarget.japanese;
    } else if (currentLevel === 3) {
        labelEl.innerText = "言い換え / 意味 (英語):";
        wordEl.innerText = currentTarget.paraphrase;
    }
}

function spawnBlock() {
    if (isGameOver || isCountingDown) return;

    let selected = (Math.random() < 0.4 && currentTarget) 
        ? currentTarget 
        : VOCAB_POOL[Math.floor(Math.random() * VOCAB_POOL.length)];

    let blockText = "";
    if (currentLevel === 1) blockText = selected.japanese;
    else if (currentLevel === 2) blockText = selected.english;
    else if (currentLevel === 3) blockText = selected.english;

    let randomCol = Math.floor(Math.random() * COLS);

    if (activeBlocks.some(b => b.col === randomCol && b.row === 0)) {
        handleBoardOverflow();
        return;
    }

    activeBlocks.push({
        text: blockText,
        type: selected.type,
        col: randomCol,
        row: 0,
        isGarbage: false,
        instanceId: Date.now() + Math.random()
    });
}

function handleBoardOverflow() {
    activeBlocks = [];
    streakCount = 0;
    currentScore = Math.max(0, currentScore - gameSettings.overflowPenalty);

    const matrix = document.getElementById('tetris-matrix');
    const overlay = document.getElementById('penalty-overlay');
    
    matrix.classList.add('shake');
    overlay.style.display = 'block';

    setTimeout(() => {
        matrix.classList.remove('shake');
        overlay.style.display = 'none';
    }, 1200);

    renderGame();
}

function gameLoop() {
    if (isGameOver || isCountingDown) return;

    applyGravity();
    spawnBlock();
    renderGame();
}

function applyGravity() {
    for (let r = ROWS - 2; r >= 0; r--) {
        activeBlocks.forEach(block => {
            if (block.row === r) {
                let hasBlockBelow = activeBlocks.some(b => b.col === block.col && b.row === r + 1);
                if (!hasBlockBelow) {
                    block.row++;
                }
            }
        });
    }
}

function handleBlockTap(clickedBlock) {
    if (isGameOver || isCountingDown || clickedBlock.isGarbage) return;

    let index = activeBlocks.findIndex(b => b.instanceId === clickedBlock.instanceId);
    if (index === -1) return;

    let isCorrect = false;
    if (currentLevel === 1) isCorrect = (clickedBlock.text === currentTarget.japanese);
    else if (currentLevel === 2) isCorrect = (clickedBlock.text === currentTarget.english);
    else if (currentLevel === 3) isCorrect = (clickedBlock.text === currentTarget.english);

    if (isCorrect) {
        streakCount++;
        currentScore += 100 * Math.min(streakCount, 5);
        
        activeBlocks.splice(index, 1);

        if (streakCount >= gameSettings.garbageStreakReq && isMultiplayer) {
            sendPeerData({ type: 'GARBAGE', count: 1 });
        }

        setNextTarget();
    } else {
        streakCount = 0;
        currentScore = Math.max(0, currentScore - 50);
    }

    applyGravity();
    renderGame();
}

function receiveGarbageBlocks(count) {
    for (let i = 0; i < count; i++) {
        let emptyCols = [];
        for (let c = 0; c < COLS; c++) {
            if (!activeBlocks.some(b => b.col === c && b.row === 0)) {
                emptyCols.push(c);
            }
        }

        if (emptyCols.length === 0) {
            handleBoardOverflow();
            return;
        }

        let randomCol = emptyCols[Math.floor(Math.random() * emptyCols.length)];
        activeBlocks.push({
            text: "おじゃま",
            type: "garbage",
            col: randomCol,
            row: 0,
            isGarbage: true,
            instanceId: Date.now() + Math.random()
        });
    }
    applyGravity();
    renderGame();
}

function startTimer() {
    clearInterval(gameTimer);
    
    // 現在のレベルに応じた制限時間を設定
    let currentLimit = gameSettings.levelTimers[currentLevel];
    timeLeft = currentLimit;

    if (currentLimit === 'infinite') {
        document.getElementById('timer-display').innerText = "残り時間: ∞";
        return;
    }

    document.getElementById('timer-display').innerText = `残り時間: ${timeLeft}秒`;

    gameTimer = setInterval(() => {
        if (isGameOver || isCountingDown) return;
        timeLeft--;
        document.getElementById('timer-display').innerText = `残り時間: ${timeLeft}秒`;

        if (timeLeft <= 0) {
            clearInterval(gameTimer);
            finishRound();
        }
    }, 1000);
}

function finishRound() {
    isGameOver = true;
    clearInterval(dropInterval);
    clearInterval(gameTimer);

    if (isMultiplayer) {
        sendPeerData({ type: 'GAME_OVER', finalScore: currentScore });
    } else {
        alert(`タイムアップ！\n最終スコア: ${currentScore}点`);
    }
}

function evaluateWinner(oppFinalScore) {
    let title = "";
    if (currentScore > oppFinalScore) {
        title = "🏆 あなたの勝利！ (YOU WIN!)";
    } else if (oppFinalScore > currentScore) {
        title = "❌ あなたの敗北... (YOU LOSE)";
    } else {
        title = "🤝 引き分け (DRAW)";
    }

    alert(`${title}\n\nあなた: ${currentScore}点\n相手: ${oppFinalScore}点`);
}

// --- レンダリング (描画処理) ---
function renderGame() {
    const matrix = document.getElementById('tetris-matrix');
    matrix.querySelectorAll('.word-block').forEach(b => b.remove());

    let cellWidth = matrix.clientWidth / COLS;
    let cellHeight = matrix.clientHeight / ROWS;

    activeBlocks.forEach(block => {
        const el = document.createElement('div');
        el.className = `word-block ${block.isGarbage ? 'garbage' : 'type-' + block.type}`;
        el.innerText = block.text;
        el.style.left = (block.col * cellWidth) + 2 + 'px';
        el.style.top = (block.row * cellHeight) + 2 + 'px';
        el.style.width = (cellWidth - 4) + 'px';
        el.style.height = (cellHeight - 4) + 'px';

        el.addEventListener('click', () => handleBlockTap(block));
        matrix.appendChild(el);
    });

    let multiplier = Math.min(1 + Math.max(0, streakCount - 1) * 0.25, 2.0);
    document.getElementById('score-display').innerText = `スコア: ${currentScore} (🔥 x${multiplier.toFixed(2)})`;

    sendPeerData({
        type: 'SYNC',
        score: currentScore,
        blockCount: activeBlocks.length,
        blocks: activeBlocks.map(b => ({ col: b.col, row: b.row, isGarbage: b.isGarbage, type: b.type }))
    });
}

function renderOpponentBoard(oppBlocks) {
    const matrix = document.getElementById('opponent-matrix');
    matrix.querySelectorAll('.word-block').forEach(b => b.remove());

    let cellWidth = matrix.clientWidth / COLS;
    let cellHeight = matrix.clientHeight / ROWS;

    (oppBlocks || []).forEach(block => {
        const el = document.createElement('div');
        el.className = `word-block ${block.isGarbage ? 'garbage' : 'type-' + block.type}`;
        el.style.left = (block.col * cellWidth) + 1 + 'px';
        el.style.top = (block.row * cellHeight) + 1 + 'px';
        el.style.width = (cellWidth - 2) + 'px';
        el.style.height = (cellHeight - 2) + 'px';
        matrix.appendChild(el);
    });
}

// アプリケーション起動
initPeer();
restartGame();
</script>
