<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-Player Battle Lobby</title>
  
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    #qrcode-wrapper {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      display: inline-block;
      margin: 1.5rem 0;
      min-width: 200px;
      min-height: 200px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #334155;
      color: #38bdf8;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="lobby-screen">
      <h1 id="role-title">Connecting...</h1>
      <p id="instruction-text">Establishing network connection to server...</p>

      <!-- Player 1 QR Container -->
      <div id="qrcode-wrapper" class="hidden">
        <div id="qrcode"></div>
      </div>

      <div>
        <span id="status-tag" class="status-badge">Initializing...</span>
      </div>
    </div>

    <!-- Game Screen (placeholder) -->
    <div id="game-screen" class="hidden">
      <h1>Battle Room Active</h1>
      <p>Player 1 and Player 2 are connected!</p>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const hostId = urlParams.get("hostId");
      const role = urlParams.get("role");

      // Check if user is scanning to join as Player 2
      if (hostId && role === "p2") {
        initPlayer2(hostId);
      } else {
        initPlayer1();
      }
    });

    // --- PLAYER 1 (HOST) LOGIC ---
    function initPlayer1() {
      document.getElementById("role-title").textContent = "Player 1 (Host)";
      document.getElementById("instruction-text").textContent = "Scan this QR code with Player 2's device to join:";
      
      const peer = new Peer();

      peer.on("open", (id) => {
        console.log("Player 1 Peer ID:", id);
        document.getElementById("status-tag").textContent = "Waiting for Player 2...";
        
        // Render QR code after Peer ID is confirmed
        renderQRCode(id);
      });

      peer.on("connection", (conn) => {
        console.log("Player 2 connected:", conn.peer);
        document.getElementById("status-tag").textContent = "Connected!";
        
        conn.on("open", () => {
          startGame(conn);
        });
      });

      peer.on("error", (err) => {
        console.error("PeerJS Error:", err);
        document.getElementById("status-tag").textContent = "Connection Error";
      });
    }

    function renderQRCode(peerId) {
      const wrapper = document.getElementById("qrcode-wrapper");
      const container = document.getElementById("qrcode");
      
      wrapper.classList.remove("hidden");
      container.innerHTML = ""; // Clear existing

      // Generate exact full Vercel URL with connection parameters
      const baseUrl = window.location.origin + window.location.pathname;
      const joinUrl = `${baseUrl}?hostId=${encodeURIComponent(peerId)}&role=p2`;

      console.log("Generated Join URL:", joinUrl);

      // Timeout guarantees the DOM container is visible before canvas/image generation
      setTimeout(() => {
        new QRCode(container, {
          text: joinUrl,
          width: 200,
          height: 200,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }, 100);
    }

    // --- PLAYER 2 (CLIENT) LOGIC ---
    function initPlayer2(hostId) {
      document.getElementById("role-title").textContent = "Player 2 (Joining)";
      document.getElementById("instruction-text").textContent = "Connecting to Player 1's room...";
      document.getElementById("status-tag").textContent = "Connecting...";

      const peer = new Peer();

      peer.on("open", (myId) => {
        console.log("Player 2 initialized with ID:", myId);
        
        // Connect directly to Host
        const conn = peer.connect(hostId);

        conn.on("open", () => {
          console.log("Successfully connected to Player 1!");
          document.getElementById("status-tag").textContent = "Connected!";
          startGame(conn);
        });

        conn.on("error", (err) => {
          console.error("Connection to host failed:", err);
          document.getElementById("status-tag").textContent = "Failed to Join";
        });
      });
    }

    // --- GAME START TRANSITION ---
    function startGame(connection) {
      document.getElementById("lobby-screen").classList.add("hidden");
      document.getElementById("game-screen").classList.remove("hidden");
      
      // Send/Receive game state over WebRTC data channel
      connection.on("data", (data) => {
        console.log("Received data:", data);
      });
    }
  </script>
</body>
</html>
