<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Battle Game - Config & QR Lobby</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1, h2 {
            text-align: center;
            color: #4caf50;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #bbb;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
            font-family: monospace;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .qr-area {
            margin-top: 24px;
            padding: 16px;
            background-color: #2a2a2a;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .qr-code {
            display: flex;
            justify-content: center;
            margin: 16px 0;
        }

        .pin-code {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #ffca28;
            margin: 10px 0;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>対戦設定＆QR生成</h1>

    <!-- 設定フォーム -->
    <div class="form-group">
        <label>タイマー設定 (秒):</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="time-r1" value="45" placeholder="R1">
            <input type="number" id="time-r2" value="60" placeholder="R2">
            <input type="number" id="time-r3" value="90" placeholder="R3">
        </div>
    </div>

    <div class="form-group">
        <label>ブロック落下速度 (ms):</label>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="speed-r1" value="1500" placeholder="R1">
            <input type="number" id="speed-r2" value="1500" placeholder="R2">
            <input type="number" id="speed-r3" value="2500" placeholder="R3">
        </div>
    </div>

    <div class="form-group">
        <label for="garbage-req">お邪魔ブロック送信に必要な連鎖/正解数:</label>
        <input type="number" id="garbage-req" value="3">
    </div>

    <div class="form-group">
        <label for="custom-vocab-input">カスタム単語データ (英語, 日本語, 類義語/説明, タイプ):</label>
        <textarea id="custom-vocab-input" placeholder="apple, リンゴ, fruit, food&#10;book, 本, read, item"></textarea>
    </div>

    <!-- 修正対象のボタン -->
    <button class="btn" onclick="adminApplySettings()">設定・単語データをQRに生成 ➔</button>

    <!-- QR表示エリア -->
    <div id="admin-p1-area" class="qr-area">
        <h2>P1用ルームコード</h2>
        <div id="admin-pin-display" class="pin-code">----</div>
        <p>以下のQRコードをスキャンして接続してください</p>
        <div id="admin-p1-qrcode" class="qr-code"></div>
    </div>
</div>

<audio id="bgm-player" src=""></audio>

<script>
    // グローバル設定オブジェクト
    let adminSettings = {
        timers: [0, 45, 60, 90],
        dropSpeeds: [0, 1500, 1500, 2500],
        garbageReq: 3
    };

    let VOCAB_POOL = [];
    let roomPinCode = "";
    let rawGeneratedPayload = "";

    // データエンコード用のユーティリティ
    function encodeFullConfigPayload(pin, settings, vocab) {
        const configData = {
            pin: pin,
            cfg: settings,
            words: vocab
        };
        return JSON.stringify(configData);
    }

    // カスタム単語入力のパース（例外を防止）
    function parseCustomVocabInput() {
        const inputEl = document.getElementById('custom-vocab-input');
        if (!inputEl) return;
        const rawText = inputEl.value.trim();
        if (!rawText) return;

        const lines = rawText.split('\n');
        const parsed = [];
        lines.forEach(line => {
            const p = line.split(',').map(s => s.trim());
            if (p.length >= 2) {
                parsed.push({
                    english: p[0],
                    japanese: p[1],
                    paraphrase: p[2] || "SYNONYM / EXPLANATION",
                    type: p[3] || "object"
                });
            }
        });
        if (parsed.length > 0) {
            VOCAB_POOL = parsed;
        }
    }

    // 管理者設定の適用とQRコード生成
    function adminApplySettings() {
        try {
            // 1. 入力値の安全な読み込み
            adminSettings.timers[1] = parseInt(document.getElementById('time-r1').value, 10) || 45;
            adminSettings.timers[2] = parseInt(document.getElementById('time-r2').value, 10) || 60;
            adminSettings.timers[3] = parseInt(document.getElementById('time-r3').value, 10) || 90;

            adminSettings.dropSpeeds[1] = parseInt(document.getElementById('speed-r1').value, 10) || 1500;
            adminSettings.dropSpeeds[2] = parseInt(document.getElementById('speed-r2').value, 10) || 1500;
            adminSettings.dropSpeeds[3] = parseInt(document.getElementById('speed-r3').value, 10) || 2500;

            adminSettings.garbageReq = parseInt(document.getElementById('garbage-req').value, 10) || 3;

            // 2. 単語データのパース
            parseCustomVocabInput();

            // 3. オーディオ再生エラーの防止（非ブロック処理）
            const audio = document.getElementById('bgm-player');
            if (audio && audio.src) {
                audio.play().catch(e => {
                    console.log("Audio play postponed until user interaction:", e);
                });
            }

            // 4. PINおよびペイロードの生成
            roomPinCode = Math.floor(1000 + Math.random() * 9000).toString();
            rawGeneratedPayload = encodeFullConfigPayload(roomPinCode, adminSettings, VOCAB_POOL);

            // 5. PINの表示およびエリアの可視化
            document.getElementById('admin-pin-display').innerText = roomPinCode;
            document.getElementById('admin-p1-area').style.display = 'block';

            // 6. QRコードの生成 (外部APIを利用したフォールバック描画)
            const qrContainer = document.getElementById('admin-p1-qrcode');
            qrContainer.innerHTML = `
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(rawGeneratedPayload)}" 
                     alt="Admin P1 QR Code" 
                     style="width: 220px; height: 220px; display: block; margin: 0 auto;" />
            `;
        } catch (err) {
            console.error("Error in adminApplySettings:", err);
            alert("設定の生成中にエラーが発生しました: " + err.message);
        }
    }
</script>
</body>
</html>
